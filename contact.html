<!DOCTYPE html>
<html: lang>
    <head>
        <meta charset="UTF-8">
        <title> Brangman & Co </title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body> 
        <div id="wrapper"> 
            <div class="top">
                <h1> Brangman & Co </h1>
            </div>
            <div id="header">
                <nav>
                    <ul>
                        <li><div class="logo"><img src="IMG_1778.JPG" alt="logo"></div></li>
                        <li><a href="index.html"> Home </a></li>
                    </ul>
                </nav>
            </div>
            <div id="banner">
                <h1> Contact Me </h1>
                <form action="mailto: sbrangman@outlook.com" ?subject="Comment" method="POST" enctype="text/plain" name="form">
                    <p> 
                        <label for="name"> Name: </label> 
                        <input type="text" id="name" size="32" placeholder="Your name or nickname here" size="48"> 
                    </p>
                    <p>
                        <label for="date"> When is your birthday? </label> 
                        <input type="date" name="birthday">
                    </p>
                    <p> 
                        <label for="email"> Email </label> 
                        <input name="email" type="email" size="40" placeholder="john.smith@email.com"> 
                    </p>
                    <p> 
                        <label for="comments"> Comments </label><br> 
                        <textarea name="comments" cols="60" rows="6"></textarea> 
                    </p>
                    <p>
                        <input type="submit" value="Submit"/>
                    </p>
                    <p>
                        <input type="reset" value="Reset"/>
                    </p>     
                </form>
                <div id="clear"></div>
                <div id="footer">
                    <h5> © 2022- by Samuel Brangman </h5>
                </div>
            </div>  
        </div> 
    </body> 
</html>
